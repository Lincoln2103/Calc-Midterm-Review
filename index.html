<style>/* Layout concept: a notebook page — the work column on the left, a graph-paper scratch margin on the right. */
:root{
  --paper:#f5f7fa; --card:#ffffff; --ink:#18202f; --muted:#5b6578; --faint:#8a93a5;
  --rule:#dfe4ec; --grid:#e8ecf2; --accent:#2747c4; --accent-soft:#e8edfc;
  --ok:#1d8051; --ok-soft:#e3f3ea; --bad:#c43c27; --bad-soft:#fbe9e5; --warn:#a86c06; --warn-soft:#fbf1dc;
  --ink-pen:#18202f; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  --f-display:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --card:#191f2a; --ink:#e7ebf3; --muted:#a3acbd; --faint:#7a8395;
  --rule:#2b3342; --grid:#1f2633; --accent:#8ea4ff; --accent-soft:#232c4a;
  --ok:#5cc58e; --ok-soft:#173326; --bad:#ff8a73; --bad-soft:#3a1f1a; --warn:#e8b14d; --warn-soft:#352a14;
  --ink-pen:#e7ebf3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --card:#191f2a; --ink:#e7ebf3; --muted:#a3acbd; --faint:#7a8395;
  --rule:#2b3342; --grid:#1f2633; --accent:#8ea4ff; --accent-soft:#232c4a;
  --ok:#5cc58e; --ok-soft:#173326; --bad:#ff8a73; --bad-soft:#3a1f1a; --warn:#e8b14d; --warn-soft:#352a14;
  --ink-pen:#e7ebf3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
.katex{font-size:1.08em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:650;font-size:19px;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:14px}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:hover{color:var(--ink)}
.spacer{flex:1}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:650;line-height:1.15}
h2{font-size:22px;font-weight:620}
h3{font-size:17px;font-weight:620}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:550;font-size:15px;min-height:44px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1220}}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}

/* ===== home / map ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:28px}
.hero .lead{max-width:62ch;color:var(--muted);margin:10px 0 18px}
.next{padding:20px;display:flex;flex-direction:column;gap:10px}
.next .tname{font-family:var(--f-display);font-size:21px;font-weight:620}
.readiness{display:grid;gap:10px;margin-top:4px}
.rbar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.rbar .bar{height:8px;border-radius:5px;background:var(--grid);overflow:hidden}
.rbar .bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.rbar b{font-family:var(--f-mono);font-weight:500;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.chapter{margin-top:30px}
.chapter-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.chapter-head .eyebrow{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{position:relative;text-align:left;padding:12px 14px 12px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px}
.tile:hover{border-color:var(--faint)}
.tile .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile .ttl{font-weight:600;font-size:15px;line-height:1.3}
.tile .st{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12.5px;color:var(--muted)}
.tile::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--rule)}
.tile[data-st="mastered"]::before{background:var(--ok)}
.tile[data-st="learning"]::before{background:var(--accent)}
.tile[data-st="review"]::before{background:var(--warn)}
.tile[data-st="locked"]{cursor:default;opacity:.55;box-shadow:none}
.tile[data-st="locked"]:hover{border-color:var(--rule)}
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--rule);white-space:nowrap}
.pill.mastered{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.learning{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.pill.review{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.cp-tile{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin-top:12px;border:1px dashed var(--faint);border-radius:var(--r)}

/* ===== work layout ===== */
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:20px;align-items:start}
.work.noscratch{grid-template-columns:minmax(0,1fr)}
.main-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px}
.qcard{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.prompt{font-size:18px;line-height:1.6}
.prompt .katex-display{margin:.6em 0}
.figure{overflow-x:auto;display:flex;justify-content:center}
.figure svg{max-width:100%;height:auto}
table.vals{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:4px auto;font-size:15px}
table.vals td,table.vals th{border:1px solid var(--rule);padding:5px 10px;text-align:center}
table.vals th{background:var(--grid);font-weight:600}
.tablewrap{overflow-x:auto}

/* answer widgets */
.answer{display:flex;flex-direction:column;gap:12px}
.part{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--rule)}
.part:first-child{border-top:0;padding-top:0}
.part-label{font-size:16px}
.part .mark{font-family:var(--f-mono);font-size:12px;margin-left:8px}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--card);border-radius:9px;padding:9px 14px;cursor:pointer;min-height:44px;font-size:16px;text-align:left}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft)}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:center;border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;min-height:52px;font-size:17px}
.choice .let{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;flex:none}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .let{background:var(--accent);color:var(--card);border-color:var(--accent)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.cover{border:1.5px dashed var(--faint);border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted)}
.entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entry input{font-family:var(--f-mono);font-size:18px;padding:9px 12px;border:1.5px solid var(--rule);border-radius:9px;background:var(--card);color:var(--ink);width:min(240px,100%);min-height:44px}
.entry input:focus{border-color:var(--accent);outline:none}
.entry input.ok{border-color:var(--ok)} .entry input.bad{border-color:var(--bad)}
.preview{min-height:30px;font-size:18px;color:var(--ink)}
.preview .muted{font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:440px}
.keypad button{min-height:46px;border:1px solid var(--rule);background:var(--card);border-radius:8px;font-size:17px;cursor:pointer;font-family:var(--f-mono)}
.keypad button:hover{border-color:var(--faint)}
.keypad button.fn{background:var(--grid)}
.keypad button.wide{grid-column:span 2}
.hint-line{font-size:13px;color:var(--muted)}

/* feedback */
.fb{padding:16px 18px;border-radius:var(--r);display:flex;flex-direction:column;gap:10px;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.fb .verdict{font-family:var(--f-display);font-size:20px;font-weight:650}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.trap{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li{padding-left:4px}
.solution{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:12px 16px}
.solution h3{font-size:15px;margin-bottom:8px;font-family:var(--f-body);font-weight:650}
.writeit{border-left:3px solid var(--accent);padding:6px 0 6px 12px;background:transparent}
.streak-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;padding:8px 12px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}

.lcard{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.rule{font-family:var(--f-display);font-size:20px;line-height:1.45}
.lsec{display:flex;flex-direction:column;gap:6px}
.lsec .eyebrow{margin-bottom:2px}
.hook{background:var(--accent-soft);border-radius:9px;padding:10px 14px;font-weight:550}
.trapbox{background:var(--bad-soft);border-radius:9px;padding:10px 14px}
.files{font-size:13.5px;color:var(--muted)}

/* scratchpad */
.scratch{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:8px}
.scratch-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scratch-bar .eyebrow{margin-right:auto}
.tool{border:1px solid var(--rule);background:var(--card);border-radius:8px;min-height:36px;min-width:36px;padding:4px 10px;cursor:pointer;font-size:13px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pad{position:relative;height:min(72vh,640px);border:1px solid var(--rule);border-radius:var(--r);background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;overflow:hidden;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad .ph{position:absolute;left:14px;top:10px;font-size:13px;color:var(--faint);pointer-events:none}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sheet .item h3{font-size:16px}
.score{font-family:var(--f-display);font-size:44px;font-weight:650;line-height:1}
.rubric label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--rule);cursor:pointer}
.rubric input{width:20px;height:20px;margin-top:3px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
textarea.code{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}

/* graphs */
.g-grid{stroke:var(--grid);stroke-width:1}
.g-axis{stroke:var(--faint);stroke-width:1.2}
.g-tick{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.g-curve{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.g-curve2{fill:none;stroke:var(--warn);stroke-width:2.2}
.g-asym{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.g-dot{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.g-open{fill:var(--card);stroke:var(--accent);stroke-width:2}
.g-lab{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.g-bg{fill:var(--card)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .work{grid-template-columns:minmax(0,1fr)}
  .scratch{position:static}
  .pad{height:380px}
}
@media (max-width:520px){
  .qcard,.lcard{padding:16px}
  .prompt{font-size:17px}
  .kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .fb,.lcard,.qcard{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(4px)}to{transform:none}}
}

  if (y0 <= 0 && y1 >= 0) s += `<line class="g-axis" x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (x0 <= 0 && x1 >= 0) s += `<line class="g-axis" y1="${pt}" y2="${H - pb}" x1="${X(0)}" x2="${X(0)}"/>`;

  const tx = (x0 <= 0 && x1 >= 0) ? X(0) - 5 : pl - 4;
  for (let y = Math.ceil(y0); y <= y1; y++) if (y !== 0 && (y1 - y0 <= 12 || y % 2 === 0)) s += `<text class="g-tick" x="${Math.max(tx, 10)}" y="${Y(y) + 3.5}" text-anchor="end">${y}</text>`;
  s += `<g clip-path="url(#${id})">`;
  (sp.vas || []).forEach(a => { s += `<line class="g-asym" x1="${X(a)}" x2="${X(a)}" y1="${pt}" y2="${H - pb}"/>`; });
  (sp.has || []).forEach(h => { const [y, a, b] = Array.isArray(h) ? h : [h, x0, x1]; s += `<line class="g-asym" x1="${X(a)}" x2="${X(b)}" y1="${Y(y)}" y2="${Y(y)}"/>`; });

    return `<div class="solution"><h3>Model answer</h3><ol class="steps">${q.model.map(l => `<li>${MS(l)}</li>`).join('')}</ol></div>
      <div class="rubric"><div class="eyebrow" style="margin:8px 0 4px">Scoring guide · tick each point you earned</div>${q.rubric.map((r, i) => `<label><input type="checkbox" data-rub="${i}" ${a.rub[i] ? 'checked' : ''} ${checked ? 'disabled' : ''}><span><b>${esc(r[0])}</b> ${M(r[1])}</span></label>`).join('')}</div>`;

/* grading */
function grade(q, a) {
  if (q.kind === 'num') {
    const g = parseAnswer(a.text); const ok = accepts(g, q.ans);
    let trap = null; if (!ok && q.traps) for (const tr of q.traps) if (accepts(g, tr.a)) { trap = tr.msg; break; }
    if (!ok && !trap && g.k === 'err') trap = 'The answer could not be read. Use forms like -3/4, 2√3, π/6, ∞ or DNE.';
    return { ok, trap, given: g.tex ? '$' + g.tex + '$' : esc(a.text) };
  }
  if (q.kind === 'chips' || q.kind === 'mcq') { const list = q.kind === 'chips' ? q.opts : q.choices; const c = list[a.sel]; return { ok: !!c[1], trap: c[1] ? null : (c[2] || null), given: c[0] }; }
  if (q.kind === 'multi') {
    let trap = null; const given = [];
    const parts = q.parts.map((p, i) => {
      if (p.kind === 'num') { const g = parseAnswer(a.parts[i].text); const ok = accepts(g, p.ans); if (!ok && !trap && p.traps) for (const tr of p.traps) if (accepts(g, tr.a)) { trap = tr.msg; break; } given.push(g.tex ? '$' + g.tex + '$' : esc(a.parts[i].text)); return ok; }
      const c = p.opts[a.parts[i].sel]; given.push(c[0]); if (!c[1] && !trap && c[2]) trap = c[2]; return !!c[1];
    });
    return { ok: parts.every(Boolean), parts, trap, given: given.join(' ; ') };
  }
  if (q.kind === 'frq') { const pts = q.rubric.filter((r, i) => a.rub[i]).length; return { ok: pts === q.rubric.length, pts, total: q.rubric.length, given: `${pts}/${q.rubric.length} points` }; }
}
function correctTex(q) {
  if (q.kind === 'num') return K(ansTex(q.ans));
  if (q.kind === 'chips') return M(q.opts.find(o => o[1])[0]);
  if (q.kind === 'mcq') { const i = q.choices.findIndex(c => c[1]); return `(${'ABCDE'[i]}) ` + M(q.choices[i][0]); }
  if (q.kind === 'multi') return q.parts.map(p => p.kind === 'num' ? K(ansTex(p.ans)) : M(p.opts.find(o => o[1])[0])).join(' ; ');
  return '';
}
function logMistake(t, q, res) {

}
function doCheck() {
  if (R.checked) return; const q = R.q; if (!canCheck(q, R.a)) return;
  const res = grade(q, R.a); R.res = res; R.checked = true;
  if (R.view === 'q') {
    const t = TYPES[R.typeId], ts = tstate(t.id);
    ts.att++; if (res.ok) ts.ok++;
    S.log.push({ id: t.id, ok: res.ok, m: R.mode, at: Date.now() }); if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000);
    R.before = ts.st;
    if (R.mode === 'check') {
      ts.first = res.ok; ts.ci++;
      if (res.ok) { ts.st = 'mastered'; ts.streak = 3; } else { ts.st = 'learning'; ts.streak = 0; ts.miss = 1; }
    } else if (R.mode === 'drill') {

function feedbackHTML() {

const IVT_CONC = (d, a, b) => [`Yes: by the IVT there is a $c$ in $(${a},${b})$ with $f(c)=${d}$`, `No guarantee: $${d}$ is not between $f(${a})$ and $f(${b})$`, `No guarantee: $f$ is not continuous on $[${a},${b}]$`];

      { label: `(a) Is $f$ continuous on $[${a},${b}]$?`, kind: 'chips', opts: [opt('Yes', true), opt('No', false, '$f$ is a polynomial. Polynomials are continuous everywhere.')] },

      { label: '(d) Conclusion', kind: 'chips', opts: [opt(C[0], between, `$${d}$ is not between $${fa}$ and $${fb}$, so the IVT says nothing.`), opt(C[1], !between, `$${d}$ is between $${fa}$ and $${fb}$, and $f$ is continuous, so the IVT applies.`), opt(C[2], false, 'Polynomials are continuous.')] }],
      sol: [`$f$ is a polynomial, so it is continuous on $[${a},${b}]$.`, `$f(${a}) = ${fa}$ and $f(${b}) = ${fb}$.`, between ? `$${d}$ is between them, so the IVT guarantees such a $c$.` : `$${d}$ is not between them, so the IVT does not guarantee it.`],
      write: between ? [`$f$ is a polynomial, so $f$ is continuous on $[${a},${b}]$.`, `$f(${a}) = ${fa}$ and $f(${b}) = ${fb}$, and $${lo} < ${d} < ${hi}$.`, `By the Intermediate Value Theorem, there is a $c$ in $(${a},${b})$ with $f(c) = ${d}$.`] : null });
  }
  const h = rnd(-1, 2), k = nz(-4, 4), a = h - rnd(1, 2), b = h + rnd(1, 3); const fa = fr(k, a - h), fb = fr(k, b - h); const d = 0;
  const C = IVT_CONC(d, a, b);
  return qMulti({ prompt: `Let $f(x) = ${F(k, xMinus(h))}$. Must there be a value $c$ in $(${a},${b})$ with $f(c) = ${d}$?`, parts: [
    { label: `(a) Is $f$ continuous on $[${a},${b}]$?`, kind: 'chips', opts: [opt('Yes', false, `$f$ is undefined at $x=${h}$, which is inside $[${a},${b}]$.`), opt('No', true)] },
    { label: `(b) $f(${a}) =$`, kind: 'num', ans: A.val(fa) }, { label: `(c) $f(${b}) =$`, kind: 'num', ans: A.val(fb) },

    sol: [`$f$ has a vertical asymptote at $x=${h}$, inside the interval. Not continuous.`, `$f(${a}) = ${fa.tex()}$, $f(${b}) = ${fb.tex()}$.`, `The IVT does not apply. In fact $f(x)=${F(k, xMinus(h))}$ is never 0.`] });
}

}

/* ---------- 2.11a Where f is not differentiable ---------- */

/* ---------- 2.12 Reading f' from a graph ---------- */
function plGraph(pts) { return { pieces: pts.slice(0, -1).map((p, i) => ({ f: x => p[1] + (pts[i + 1][1] - p[1]) / (pts[i + 1][0] - p[0]) * (x - p[0]), a: p[0], b: pts[i + 1][0] })), dots: [] }; }

  const kind = pick(['slope', 'corner', 'comp', 'prod']); const segX = i => pts[i][0] + 1; // midpoint of segment i
  if (kind === 'slope') { const i = rnd(0, 3), x0 = segX(i); return qNum({ prompt: `The graph of $f$ is shown. Find $f'(${x0})$.`, fig, ans: A.val(slope(i)), traps: [{ a: A.val(fAt(x0)), msg: `That is $f(${x0})$, the height. $f'(${x0})$ is the slope of the segment.` }], sol: [`$x = ${x0}$ is on the segment from $(${pts[i]})$ to $(${pts[i + 1]})$.`, `Slope $= ${F(`${pts[i + 1][1]} - ${par(pts[i][1])}`, `${pts[i + 1][0]} - ${par(pts[i][0])}`)} = ${slope(i).tex()}$.`] }); }
  if (kind === 'corner') { const i = rnd(1, 3); if (slope(i - 1).eq(slope(i))) return genGraphD(); const x0 = pts[i][0];
    return qNum({ prompt: `The graph of $f$ is shown. Find $f'(${x0})$, or write DNE.`, fig, ans: A.dne(), traps: [{ a: A.val(slope(i - 1)), msg: 'That is only the slope on the left. At a corner the two slopes differ, so DNE.' }, { a: A.val(slope(i)), msg: 'That is only the slope on the right. At a corner the two slopes differ, so DNE.' }], sol: [`At $x=${x0}$ the graph has a corner.`, `Left slope $${slope(i - 1).tex()}$, right slope $${slope(i).tex()}$: different, so $f'(${x0})$ does not exist.`] }); }

const frq = () => qFrq({ src: 'Chapter 3 Quiz Review · FRQ 1', prompt: 'Consider the curve $2xy + y^2 = 8$ for $y > 0$. (1) Find $\\frac{dy}{dx}$. (2) Write an equation of the line tangent to the curve at $(1,2)$. (3) Evaluate $\\frac{d^2y}{dx^2}$ at $(1,2)$. (4) The points $(1,2)$ and $(\\frac72, 1)$ are on the curve. Find $(y^{-1})\'(1)$.',
  model: ["(1) $2y + 2xy' + 2yy' = 0$, so $\\frac{dy}{dx} = -\\frac{y}{x+y}$.", '(2) At $(1,2)$: slope $-\\frac23$. $y - 2 = -\\frac23(x - 1)$.', "(3) $y'' = -\\frac{y'(x+y) - y(1+y')}{(x+y)^2} = -\\frac{xy' - y}{(x+y)^2}$. At $(1,2)$ with $y' = -\\frac23$: $-\\frac{-\\frac23 - 2}{9} = \\frac{8}{27}$.", "(4) At $(\\frac72, 1)$: $y' = -\\frac{1}{\\frac72 + 1} = -\\frac29$, so $(y^{-1})'(1) = \\frac{1}{-2/9} = -\\frac92$."],
  rubric: [['(1)', 'Differentiated implicitly with the product rule on $2xy$.'], ['(1)', "Solved: $\\frac{dy}{dx} = -\\frac{y}{x+y}$."], ['(2)', 'Tangent line $y - 2 = -\\frac23(x-1)$.'], ['(3)', 'Differentiated $\\frac{dy}{dx}$ again (quotient rule with $y\'$ inside).'], ['(3)', 'Value $\\frac{8}{27}$.'], ['(4)', 'Value $-\\frac92$ using the slope at $(\\frac72, 1)$.']] });
